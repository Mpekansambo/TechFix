<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management | TechFix Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background: #f8f9fa; }
    .low-stock { color: red; font-weight: bold; }
    .card { margin-top: 20px; }
  </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="admin-dashboard.html">TechFix Admin</a>
  </div>
</nav>

<div class="container my-5">
  <h2 class="fw-bold mb-4">Inventory Management</h2>

  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Category</th>
          <th>Stock Quantity</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="inventoryTable"></tbody>
    </table>
  </div>
</div>

<!-- Firebase Scripts -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBvuIuy8B1QlGJk5uZFY-uzFNUKZ0P1O7U",
  authDomain: "techfix-messages.firebaseapp.com",
  databaseURL: "https://techfix-messages-default-rtdb.firebaseio.com/",
  projectId: "techfix-messages",
  storageBucket: "techfix-messages.firebasestorage.app",
  messagingSenderId: "857990920188",
  appId: "1:857990920188:web:0c830bdd0cde48030f6479"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Inventory Table
const inventoryTable = document.getElementById("inventoryTable");
const inventoryRef = ref(db, "inventory");

// Render Inventory
function renderInventory(data) {
  inventoryTable.innerHTML = "";
  Object.entries(data).forEach(([key, item]) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${item.name}</td>
      <td>
        <input type="number" class="form-control stock-input" value="${item.stock}" min="0" data-key="${key}">
      </td>
      <td>
        <button class="btn btn-success btn-sm update-btn" data-key="${key}">Update</button>
      </td>
    `;
    if (item.stock <= 5) tr.querySelector("input").classList.add("low-stock");
    inventoryTable.appendChild(tr);
  });
}

// Listen for inventory updates
onValue(inventoryRef, snapshot => {
  const data = snapshot.val() || {};
  renderInventory(data);
});

// Update stock
inventoryTable.addEventListener("click", e => {
  if (e.target && e.target.classList.contains("update-btn")) {
    const key = e.target.getAttribute("data-key");
    const input = document.querySelector(`input[data-key="${key}"]`);
    const newStock = parseInt(input.value);
    if (isNaN(newStock) || newStock < 0) return alert("Enter a valid stock number");

    update(ref(db, `inventory/${key}`), { stock: newStock })
      .then(() => alert("Stock updated successfully!"))
      .catch(err => alert("Error updating stock: " + err));
  }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
